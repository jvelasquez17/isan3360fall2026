<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Web Dev Tutor</title>
        <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    </head>
    <body>
        <div class="container py-4">
            <h1>Web Dev Tutor</h1>
            <div id="chat" class="card card-body mb-3"></div>
            <form id="ask" class="input-group">
                <input id="question" class="form-control" placeholder="Ask a question">
                <button class="btn btn-primary">Send</button>
            </form>

            <h2 class="mt-4">Temperature Converter</h2>
            <form id = "convert" class="input-group">
                <input id="celsius" class="form-control" placeholder="Degrees Celsius">
                <button class="btn btn-secondary">Convert</button>
            </form>
            <p id="result" class="mt-2"></p>

            <h3 class="mt-4"> Temperature Converter</h3>
            <form id="formf" class="input-group">
                <input id="fahrenheit" class="form-control" placeholder="Degrees Fahrenheit">
                <button class="btn btn-secondary">Convert</button>
            </form>
            <p id="resultf" class="mt-2"></p>
        </div>
        <script src="script.js"></script>
        <script src="env.js"></script>
    </body>
</html>`
